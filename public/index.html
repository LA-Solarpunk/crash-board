<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CRASH Space</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sixtyfour:wght@400&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="next-bus-highlight-enabled">
        <div class="top-row">
            <div class="events-grid" id="events-grid"></div>
            <div class="card card-printers" id="printers-card">
                <div class="card-title">3D PRINTERS</div>
                <div id="printer-rows"></div>
            </div>
            <div class="card card-buses">
                <div class="card-title">BUSES</div>
                <div id="bus-rows"></div>
                <div class="next-bus-highlight" id="next-bus-highlight"></div>
            </div>
        </div>

        <div class="bottom-row">
            <div class="future-events">
                <div class="section-title">FUTURE EVENTS</div>
                <div class="future-events-scroll">
                    <div id="future-events-list"></div>
                </div>
            </div>

            <div class="card card-weather" id="weather-card">
                <div class="weather-current">
                    <div class="weather-info">
                        <div class="weather-condition" id="weather-condition">
                            --
                        </div>
                        <div class="weather-hilo" id="weather-hilo"></div>
                        <div class="weather-details" id="weather-details"></div>
                    </div>
                    <div class="weather-temp" id="weather-temp">--</div>
                </div>
                <div class="weather-forecast" id="weather-forecast"></div>
            </div>

            <div class="status-card" id="status-card">
                <div class="status-top">
                    <div class="status-main" id="status-main">—</div>
                </div>
                <div class="status-bottom" id="status-bottom">
                    <span class="status-bottom-label">Last opened:</span>
                    <span class="status-bottom-time">—</span>
                </div>
            </div>
        </div>

        <div class="info-bar">
            <div class="info-date" id="date">—</div>
            <div class="info-item clock-item">
                <span id="clock">--:--:--</span>
            </div>
        </div>

        <script>
            function updateClock() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString("en-GB", {
                    hour12: false,
                });
                const dateStr = now.toLocaleDateString("en-US", {
                    weekday: "long",
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                });
                document.getElementById("clock").textContent = timeStr;
                document.getElementById("date").textContent = dateStr;
            }
            setInterval(updateClock, 1000);
            updateClock();

            function stripHtml(text) {
                // replace <br> tags with newlines first
                text = text.replace(/<br\s*\/?>/gi, "\n");
                // strip all other HTML
                const div = document.createElement("div");
                div.innerHTML = text;
                return div.textContent || div.innerText || "";
            }

            // ===== WEATHER =====
            function renderWeather(weather) {
                var tempEl = document.getElementById("weather-temp");
                var condEl = document.getElementById("weather-condition");
                var hiloEl = document.getElementById("weather-hilo");
                var detailEl = document.getElementById("weather-details");
                var forecastEl = document.getElementById("weather-forecast");

                if (
                    !weather ||
                    weather.temp === null ||
                    weather.temp === undefined
                ) {
                    tempEl.textContent = "--";
                    condEl.textContent = "No data";
                    hiloEl.textContent = "";
                    detailEl.textContent = "";
                    forecastEl.innerHTML = "";
                    return;
                }

                tempEl.textContent = weather.temp + "\u00B0";
                condEl.textContent =
                    weather.description || weather.condition || "";

                if (
                    weather.tempMax !== undefined &&
                    weather.tempMin !== undefined
                ) {
                    hiloEl.textContent =
                        "H " +
                        weather.tempMax +
                        "\u00B0  L " +
                        weather.tempMin +
                        "\u00B0";
                } else {
                    hiloEl.textContent = "";
                }

                var details = [];
                if (
                    weather.humidity !== null &&
                    weather.humidity !== undefined
                ) {
                    details.push(weather.humidity + "% humid");
                }
                if (weather.windSpeed) {
                    details.push(
                        "Wind " +
                            weather.windSpeed +
                            (weather.windDirection
                                ? " " + weather.windDirection
                                : ""),
                    );
                }
                detailEl.textContent = details.join(" \u00B7 ");

                forecastEl.innerHTML = "";
                if (weather.forecast && weather.forecast.length > 0) {
                    for (var f = 0; f < weather.forecast.length; f++) {
                        var fc = weather.forecast[f];
                        var cell = document.createElement("div");
                        cell.className = "forecast-cell";
                        cell.innerHTML =
                            '<span class="forecast-name">' +
                            fc.name +
                            "</span>" +
                            '<span class="forecast-temp">' +
                            fc.temp +
                            "\u00B0</span>";
                        forecastEl.appendChild(cell);
                    }
                }
            }

            async function refreshData() {
                try {
                    const resp = await fetch("/api/all");
                    const data = await resp.json();

                    const eventsGrid = document.getElementById("events-grid");
                    eventsGrid.innerHTML = "";

                    if (data.calendar && data.calendar.length > 0) {
                        const numCards = 4;

                        data.calendar.slice(0, numCards).forEach((event) => {
                            const card = createEventCard(event);
                            eventsGrid.appendChild(card);
                        });

                        const futureList =
                            document.getElementById("future-events-list");
                        futureList.innerHTML = "";

                        if (data.calendar.length > numCards) {
                            data.calendar
                                .slice(numCards)
                                .forEach((event, index) => {
                                    const row = createFutureEventRow(
                                        event,
                                        index + numCards + 1,
                                    );
                                    futureList.appendChild(row);
                                });
                        }
                    }

                    const busRows = document.getElementById("bus-rows");
                    busRows.innerHTML = "";

                    if (data.buses && data.buses.length > 0) {
                        cachedBuses = data.buses; // Cache for next bus highlight
                        updateNextBusHighlight(); // Update highlight immediately

                        data.buses.slice(0, 10).forEach((bus) => {
                            let timeStr;
                            if (bus.status === "BRD") {
                                timeStr = '<span class="boarding">BRD</span>';
                            } else if (bus.status === "ARR") {
                                timeStr = '<span class="arriving">ARR</span>';
                            } else if (bus.minutes > 60) {
                                // Show absolute arrival time for buses > 60 min away
                                const arrivalTime = new Date(
                                    Date.now() + bus.minutes * 60000,
                                );
                                const timeFormatted =
                                    arrivalTime.toLocaleTimeString("en-GB", {
                                        hour: "2-digit",
                                        minute: "2-digit",
                                        hour12: false,
                                    });
                                timeStr = `<span class="minutes">${timeFormatted}</span>`;
                            } else {
                                timeStr = `<span class="minutes">${bus.minutes}</span>`;
                            }

                            const row = document.createElement("div");
                            row.className = "bus-row";
                            const routeClass = `route route-${bus.route.toLowerCase()}`;
                            const liveIcon = bus.isLive
                                ? '<span class="live-icon"></span>'
                                : "";
                            row.innerHTML = `
              <span class="${routeClass}">${bus.route}</span>
              <span class="destination">${bus.destination}${liveIcon}</span>
              <span class="time">${timeStr}</span>
            `;
                            busRows.appendChild(row);
                        });
                    } else {
                        busRows.innerHTML =
                            '<div class="no-data">no buses</div>';
                    }

                    if (data.spaceStatus) {
                        const statusMain =
                            document.getElementById("status-main");
                        const statusCard =
                            document.getElementById("status-card");

                        function formatTime24(dateObj) {
                            return dateObj.toLocaleTimeString("en-GB", {
                                hour: "2-digit",
                                minute: "2-digit",
                            });
                        }

                        if (data.spaceStatus.open) {
                            statusCard.className = "status-card open";
                            statusMain.textContent = "SPACE OPEN";

                            // Show "Expires at: TIME" in bottom half
                            if (data.spaceStatus.closingTime) {
                                try {
                                    var closeParsed = new Date(
                                        data.spaceStatus.closingTime.replace(
                                            ",",
                                            "",
                                        ),
                                    );
                                    if (!isNaN(closeParsed)) {
                                        document.getElementById(
                                            "status-bottom",
                                        ).innerHTML =
                                            '<span class="status-bottom-label">Expires at:</span> <span class="status-bottom-time">' +
                                            formatTime24(closeParsed) +
                                            "</span>";
                                    }
                                } catch (e) {
                                    document.getElementById(
                                        "status-bottom",
                                    ).innerHTML =
                                        '<span class="status-bottom-label">Expires at:</span> <span class="status-bottom-time">' +
                                        data.spaceStatus.closingTime.replace(
                                            /^\d{4}-\d{2}-\d{2},\s*/,
                                            "",
                                        ) +
                                        "</span>";
                                }
                            }
                        } else if (data.spaceStatus.closed) {
                            statusCard.className = "status-card closed";
                            statusMain.textContent = "CLOSED";

                            // Show "Last opened: TIME" in bottom half
                            if (
                                data.spaceStatus.history &&
                                data.spaceStatus.history.length > 0
                            ) {
                                var lastTime = data.spaceStatus.history[0].time;
                                try {
                                    var parsed = new Date(
                                        lastTime.replace(",", ""),
                                    );
                                    if (!isNaN(parsed)) {
                                        var now = new Date();
                                        var isToday =
                                            parsed.toDateString() ===
                                            now.toDateString();
                                        var timeStr = formatTime24(parsed);
                                        var timeHtml;
                                        if (isToday) {
                                            timeHtml =
                                                '<span class="status-bottom-time">' +
                                                timeStr +
                                                "</span>";
                                        } else {
                                            var yesterday = new Date(now);
                                            yesterday.setDate(
                                                yesterday.getDate() - 1,
                                            );
                                            var isYesterday =
                                                parsed.toDateString() ===
                                                yesterday.toDateString();
                                            var prefix = isYesterday
                                                ? "Yesterday"
                                                : parsed.toLocaleDateString(
                                                      "en-US",
                                                      {
                                                          weekday: "short",
                                                          month: "short",
                                                          day: "numeric",
                                                      },
                                                  );
                                            timeHtml =
                                                '<span class="status-bottom-time">' +
                                                prefix +
                                                " \u00B7 " +
                                                timeStr +
                                                "</span>";
                                        }
                                        document.getElementById(
                                            "status-bottom",
                                        ).innerHTML =
                                            '<span class="status-bottom-label">Last opened:</span> ' +
                                            timeHtml;
                                    } else {
                                        document.getElementById(
                                            "status-bottom",
                                        ).innerHTML =
                                            '<span class="status-bottom-label">Last opened:</span> <span class="status-bottom-time">' +
                                            lastTime +
                                            "</span>";
                                    }
                                } catch (e) {
                                    document.getElementById(
                                        "status-bottom",
                                    ).innerHTML =
                                        '<span class="status-bottom-label">Last opened:</span> <span class="status-bottom-time">' +
                                        lastTime +
                                        "</span>";
                                }
                            }
                        }
                    }

                    if (data.weather) renderWeather(data.weather);
                    renderPrinters(data.printers);
                } catch (err) {
                    console.error("refresh error:", err);
                }
            }

            function renderPrinters(printers) {
                const container = document.getElementById("printer-rows");
                container.innerHTML = "";

                if (!printers || Object.keys(printers).length === 0) {
                    container.innerHTML =
                        '<div class="no-data">no printers</div>';
                    return;
                }

                Object.entries(printers).forEach(([name, info]) => {
                    const row = document.createElement("div");
                    row.className = "printer-row";

                    const state = info.status || "unknown";
                    const pct = Math.round(info.progress || 0);
                    const isActive = pct > 0 && pct != 100;
                    const stateClass = isActive
                        ? "printer-state printing"
                        : "printer-state";

                    const progressHtml = isActive
                        ? `<div class="printer-progress-bar"><div class="printer-progress-fill" style="width:${pct}%"></div></div>`
                        : "";

                    const displayState =
                        state === "Printing"
                            ? `${Math.round(info.time_remaining / 60)}m remain`
                            : state;
                    row.innerHTML = `
          <div class="printer-header">
            <span class="printer-name">${name}</span>
            <span class="${stateClass}">${displayState.toUpperCase()}</span>
          </div>
          ${progressHtml}
        `;
                    container.appendChild(row);
                });
            }

            function parseTags(title, description) {
                const tags = [];
                let cleanTitle = title || "";
                let cleanDesc = description || "";

                // extract from title
                if (cleanTitle) {
                    const titleMatches =
                        cleanTitle.match(/\[([^\]]+)\]|\(([^)]+)\)/g) || [];
                    titleMatches.forEach((match) => {
                        const tag = match.replace(/[\[\]()]/g, "");
                        const lower = tag.toLowerCase();
                        if (lower.includes("hybrid"))
                            tags.push({ text: "Hybrid", type: "hybrid" });
                        else if (lower.includes("member"))
                            tags.push({
                                text: "Members only",
                                type: "members",
                            });
                        cleanTitle = cleanTitle.replace(match, "").trim();
                    });
                }

                // extract from description
                if (
                    cleanDesc &&
                    cleanDesc.toLowerCase().includes("open to the public")
                ) {
                    tags.push({ text: "Public", type: "public" });
                    cleanDesc = cleanDesc
                        .replace(/\[?open to the public\]?/gi, "")
                        .trim();
                }

                return { tags, cleanTitle, cleanDesc };
            }

            function createEventCard(event) {
                const card = document.createElement("div");
                card.className = "card card-event";

                const now = new Date();
                const startTime = new Date(event.start);
                const endTime = event.end ? new Date(event.end) : null;

                const isLive = startTime <= now && (!endTime || endTime >= now);
                const isNext =
                    !isLive && startTime > now && startTime - now < 3600000;

                if (isLive) card.classList.add("live");

                const dateStr = startTime.toLocaleDateString("en-US", {
                    weekday: "long",
                    month: "short",
                    day: "numeric",
                });

                const timeStr = startTime.toLocaleTimeString("en-GB", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false,
                });

                let endTimeStr = "";
                if (endTime) {
                    endTimeStr =
                        "–" +
                        endTime.toLocaleTimeString("en-GB", {
                            hour: "2-digit",
                            minute: "2-digit",
                            hour12: false,
                        });
                }

                const { tags, cleanTitle, cleanDesc } = parseTags(
                    event.title,
                    event.description,
                );

                if (isNext) tags.unshift({ text: "Next", type: "next" });

                const isCancelled =
                    event.status === "cancelled" ||
                    event.title.includes("CANCELLED");
                if (isCancelled) {
                    card.classList.add("cancelled");
                }

                let desc = cleanDesc || "";
                if (desc) {
                    const maxLen = 120;
                    desc = stripHtml(desc);
                    desc =
                        desc.length > maxLen
                            ? desc.substring(0, maxLen) + "..."
                            : desc;
                } else {
                    card.classList.add("no-description");
                }

                let tagsHtml = "";
                if (tags.length > 0) {
                    const tagElements = tags
                        .map(
                            (tag) =>
                                `<div class="tag tag-${tag.type}">${tag.text}</div>`,
                        )
                        .join("");
                    tagsHtml = `<div class="event-tags">${tagElements}</div>`;
                }

                let cancelledBadge = "";
                if (isCancelled) {
                    cancelledBadge = '<div class="badge">CANCELLED</div>';
                }

                card.innerHTML = `
          <div class="event-content">
            <div class="event-time">${timeStr}${endTimeStr}</div>
            <div class="event-date">${dateStr}</div>
            <div class="event-title">${stripHtml(cleanTitle)}</div>
            ${desc ? `<div class="event-desc">${desc}</div>` : ""}
          </div>
          ${tagsHtml}
          ${cancelledBadge}
        `;

                return card;
            }

            function createFutureEventRow(event, number) {
                const row = document.createElement("div");
                row.className = "future-event-row";

                const startTime = new Date(event.start);
                const dateStr = startTime.toLocaleDateString("en-US", {
                    month: "short",
                    day: "numeric",
                });
                const timeStr = startTime.toLocaleTimeString("en-GB", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false,
                });

                const { cleanTitle } = parseTags(event.title);

                const isCancelled =
                    event.status === "cancelled" ||
                    event.title.includes("CANCELLED");
                const titleClass = isCancelled
                    ? "future-title cancelled-text"
                    : "future-title";

                row.innerHTML = `
        <span class="future-number">${number}.</span>
        <span class="future-date">${dateStr}</span>
        <span class="future-time">${timeStr}</span>
        <span class="${titleClass}">${stripHtml(cleanTitle)}</span>
      `;

                return row;
            }

            // Auto-scroll future events
            let futureEventsScrollIndex = 0;
            function scrollFutureEvents() {
                const list = document.getElementById("future-events-list");
                const rows = list.querySelectorAll(".future-event-row");
                const container = list.parentElement;
                const containerHeight = container.clientHeight;
                const rowHeight = rows[0] ? rows[0].offsetHeight : 30;
                const visibleRows = Math.floor(containerHeight / rowHeight);

                if (rows.length <= visibleRows) {
                    list.style.transform = "translateY(0)";
                    futureEventsScrollIndex = 0;
                    return;
                }

                const maxScroll = rows.length - visibleRows;
                futureEventsScrollIndex =
                    (futureEventsScrollIndex + 1) % (maxScroll + 1);
                list.style.transform = `translateY(-${futureEventsScrollIndex * rowHeight}px)`;
            }

            // Next bus highlight rotation
            let nextBusIndex = 0;
            let cachedBuses = [];

            function updateNextBusHighlight() {
                if (cachedBuses.length === 0) return;

                const highlight = document.getElementById("next-bus-highlight");
                const bus = cachedBuses[nextBusIndex];

                let timeText;
                if (bus.status === "BRD") {
                    timeText = "BOARDING";
                } else if (bus.status === "ARR") {
                    timeText = "ARRIVING";
                } else if (bus.minutes > 60) {
                    const arrivalTime = new Date(
                        Date.now() + bus.minutes * 60000,
                    );
                    timeText =
                        "at " +
                        arrivalTime.toLocaleTimeString("en-GB", {
                            hour: "2-digit",
                            minute: "2-digit",
                            hour12: false,
                        });
                } else {
                    timeText = `${bus.minutes} min`;
                }

                highlight.innerHTML = `
        <div class="route-badge">${bus.route}</div>
        <div class="destination-text">TO ${bus.destination.toUpperCase()}</div>
        <div class="time-text">${timeText}</div>
      `;

                nextBusIndex =
                    (nextBusIndex + 1) % Math.min(3, cachedBuses.length);
            }

            // Initialize everything
            function init() {
                // Auto-scroll future events every 5 seconds
                setInterval(scrollFutureEvents, 5000);

                // Rotate next bus highlight every 4 seconds
                setInterval(updateNextBusHighlight, 4000);

                setInterval(refreshData, 30000);
                refreshData();
            }

            init();
        </script>
    </body>
</html>
