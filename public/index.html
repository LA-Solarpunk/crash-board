<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CRASH Space</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sixtyfour:wght@400&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="top-row">
            <div class="events-grid" id="events-grid"></div>
            <div class="card card-printers" id="printers-card">
                <div class="card-title">3D PRINTERS</div>
                <div id="printer-rows"></div>
            </div>
            <div class="card card-buses">
                <div class="card-title">BUSES</div>
                <div id="bus-rows"></div>
            </div>
        </div>

        <div class="bottom-row">
            <div class="future-events">
                <div class="section-title">FUTURE EVENTS</div>
                <div class="future-events-scroll">
                    <div id="future-events-list"></div>
                </div>
            </div>

            <div class="card card-weather" id="weather-card">
                <div class="weather-current">
                    <div class="weather-info">
                        <div class="weather-condition" id="weather-condition">
                            --
                        </div>
                        <div class="weather-hilo" id="weather-hilo"></div>
                        <div class="weather-details" id="weather-details"></div>
                    </div>
                    <div class="weather-temp" id="weather-temp">--</div>
                </div>
                <div class="weather-forecast" id="weather-forecast"></div>
            </div>

            <div class="status-card" id="status-card">
                <div class="status-top">
                    <div class="status-main" id="status-main">—</div>
                </div>
                <div class="status-bottom" id="status-bottom">
                    <span class="status-bottom-label">Last opened:</span>
                    <span class="status-bottom-time">—</span>
                </div>
            </div>
        </div>

        <div class="info-bar">
            <div class="info-date" id="date">—</div>
            <div class="info-item clock-item">
                <span id="clock">--:--:--</span>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
